<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PWA Music Player</title>
    <!-- iOS PWA Specific Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="iPlayer">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #121212;
            --card-color: #1e1e1e;
            --accent-color: #ff2d55; /* Apple Music Pink */
            --text-color: #ffffff;
            --text-muted: #8e8e93;
            --border-color: #2c2c2e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 140px; /* Leave space for Mini-player and Nav Bar */
            padding-top: env(safe-area-inset-top);
        }

        header { padding: 20px; border-bottom: 1px solid var(--border-color); }
        h1 { font-size: 1.8rem; font-weight: bold; }

        /* View Layouts */
        .view { display: none; padding: 20px; }
        .view.active { display: block; }

        /* General List Styling */
        .list-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }
        .list-item-meta { flex: 1; margin-left: 15px; }
        .list-item-title { font-size: 1rem; font-weight: 500; }
        .list-item-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }
        .list-item-artwork { width: 45px; height: 45px; background: #333; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px; }

        /* Utility Elements */
        .btn-action { background: var(--accent-color); border: none; color: white; padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
        .btn-plus { font-size: 1.3rem; background: none; border: none; color: var(--accent-color); padding: 5px; cursor: pointer; }
        .flex-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }

        /* Mini Player (Persistent Bottom Bar) */
        .mini-player {
            position: fixed;
            bottom: 65px; left: 0; right: 0;
            background-color: var(--surface-color);
            border-top: 1px solid var(--border-color);
            display: flex; align-items: center;
            padding: 10px 20px; z-index: 100;
        }
        .mini-player-info { flex: 1; margin-left: 10px; cursor: pointer; }

        /* Native-style Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 65px;
            background-color: var(--surface-color);
            border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around;
            align-items: center; z-index: 101;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item { background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; cursor: pointer; }
        .nav-item.active { color: var(--accent-color); }
        .nav-item span { font-size: 1.4rem; margin-bottom: 2px; }

        /* Full Screen Overlay Player */
        .full-player {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-color);
            z-index: 200; transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            padding: 40px 30px env(safe-area-inset-bottom);
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .full-player.open { transform: translateY(0); }
        .close-player { background: none; border: none; color: var(--accent-color); font-size: 1.1rem; align-self: flex-start; cursor: pointer; }
        .big-art { width: 100%; aspect-ratio: 1; background: linear-gradient(135deg, #222, #444); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 80px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .scrub-container { margin: 20px 0; }
        .scrub-bar { width: 100%; accent-color: var(--accent-color); height: 5px; border-radius: 3px; cursor: pointer; }
        .time-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-top: 5px; }
        .big-controls { display: flex; justify-content: space-around; align-items: center; margin-bottom: 30px; }
        .btn-main { background: none; border: none; color: white; font-size: 2rem; cursor: pointer; }
        .btn-play-pause { font-size: 4rem; }
    </style>
</head>
<body>

    <header>
        <h1 id="view-title">Library</h1>
    </header>

    <!-- VIEW 1: ALL SONGS -->
    <div id="view-songs" class="view active">
        <div id="songs-list"></div>
    </div>

    <!-- VIEW 2: ARTISTS -->
    <div id="view-artists" class="view">
        <div id="artists-list"></div>
    </div>

    <!-- VIEW 3: PLAYLISTS -->
    <div id="view-playlists" class="view">
        <div class="flex-row">
            <h3>Your Mixes</h3>
            <button class="btn-action" onclick="createNewPlaylist()">+ New Playlist</button>
        </div>
        <div id="playlists-list"></div>
    </div>

    <!-- MINI PLAYER BAR -->
    <div class="mini-player" id="mini-player">
        <div class="list-item-artwork" id="mini-art">🎵</div>
        <div class="mini-player-info" onclick="toggleFullPlayer(true)">
            <div class="list-item-title" id="mini-title">Not Playing</div>
            <div class="list-item-subtitle" id="mini-artist">Select a song</div>
        </div>
        <button class="btn-main" id="mini-play-btn" onclick="togglePlay(event)">▶️</button>
    </div>

    <!-- BOTTOM TAB NAVIGATION -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchView('songs', this)"><span>🎵</span>Songs</button>
        <button class="nav-item" onclick="switchView('artists', this)"><span>👥</span>Artists</button>
        <button class="nav-item" onclick="switchView('playlists', this)"><span>📂</span>Playlists</button>
    </nav>

    <!-- FULL SCREEN PLAYER OVERLAY -->
    <div class="full-player" id="full-player">
        <button class="close-player" onclick="toggleFullPlayer(false)">✕ Close</button>
        <div class="big-art" id="full-art">🎵</div>
        <div>
            <h2 id="full-title" style="margin-bottom: 5px;">Track Title</h2>
            <p id="full-artist" style="color: var(--text-muted); margin-bottom: 20px;">Artist Name</p>
            
            <div class="scrub-container">
                <input type="range" class="scrub-bar" id="scrub-bar" min="0" max="100" value="0">
                <div class="time-labels">
                    <span id="time-current">0:00</span>
                    <span id="time-total">0:00</span>
                </div>
            </div>
        </div>

        <div class="big-controls">
            <button class="btn-main" onclick="playPrevious()">⏮</button>
            <button class="btn-main btn-play-pause" id="full-play-btn" onclick="togglePlay()">▶️</button>
            <button class="btn-main" onclick="playNext()">⏭</button>
        </div>
    </div>

    <!-- Hidden Native Engine -->
    <audio id="audio-engine"></audio>

    <script>
        // 1. Mock Local Music Database
        const masterSongs = [
            { id: 1, title: "After Hours", artist: "The Weeknd", src: "https://soundhelix.com", emoji: "🌃" },
            { id: 2, title: "Blinding Lights", artist: "The Weeknd", src: "https://soundhelix.com", emoji: "⚡" },
            { id: 3, title: "Bad Habits", artist: "Ed Sheeran", src: "https://soundhelix.com", emoji: "🍷" },
            { id: 4, title: "Shape of You", artist: "Ed Sheeran", src: "https://soundhelix.com", emoji: "➗" },
            { id: 5, title: "Levitating", artist: "Dua Lipa", src: "https://soundhelix.com", emoji: "🌌" }
        ];

        // Runtime states
        let currentQueue = [...masterSongs];
        let currentTrackIndex = 0;
        let playlists = JSON.parse(localStorage.getItem('pwa_playlists')) || {};

        // DOM elements
        const audio = document.getElementById('audio-engine');
        const scrubBar = document.getElementById('scrub-bar');

        // 2. View Management Switching System
        function switchView(viewId, element) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(`view-${viewId}`).classList.add('active');
            element.classList.add('active');
            document.getElementById('view-title').innerText = viewId.charAt(0).toUpperCase() + viewId.slice(1);
            
            if(viewId === 'songs') renderAllSongs();
            if(viewId === 'artists') renderArtists();
            if(viewId === 'playlists') renderPlaylists();
        }

        function toggleFullPlayer(open) {
            document.getElementById('full-player').classList.toggle('open', open);
        }
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
     </script>
